project_id = "leanguard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "com.coralcell.leanguard://login-callback"
additional_redirect_urls = ["com.coralcell.leanguard://login-callback", "com.coralcell.leanguard://reset-password"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "10MiB"

# Every user handler verifies the access token with auth.getUser itself. This
# supports both modern asymmetric signing keys and legacy Supabase JWTs.
[functions.coach]
verify_jwt = false
[functions.approve-plan]
verify_jwt = false
[functions.sync-entitlement]
verify_jwt = false
[functions.data-export]
verify_jwt = false
[functions.delete-account]
verify_jwt = false
[functions.revenuecat-webhook]
verify_jwt = false
[functions.dispatch-reminders]
verify_jwt = false
