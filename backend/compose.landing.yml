# Optional overlay; the base Caddy remains the only listener on host 80/443.
services:
  caddy:
    environment:
      LANDING_DOMAIN: ${LANDING_DOMAIN:?Set LANDING_DOMAIN to the public landing domain}
    volumes:
      - ./deploy/landing.caddy:/etc/caddy/sites/landing.caddy:ro
      - ../landing/dist:/srv/landing:ro
